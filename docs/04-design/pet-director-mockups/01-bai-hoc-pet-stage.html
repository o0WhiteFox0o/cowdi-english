<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>V2 Bài học — Cowdi trên sân khấu</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&amp;family=Itim&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5E9A35}a:hover{color:#3F6E1F}
</style>
<style>body{display:flex;justify-content:center;padding:24px;background:#e9eef2}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FDFEFF; background-image: linear-gradient(#E3F0FA 1px, transparent 1px), linear-gradient(90deg, #E3F0FA 1px, transparent 1px); background-size: 22px 22px; font-family: 'Mali', cursive; color: #3B4A5C; display: flex; flex-direction: column; position: relative; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px">
    <a href="#" aria-label="Thoát bài" style="text-decoration: none; width: 36px; height: 36px; border-radius: 50%; background: #fff; border: 2px solid #BFDBEF; display: flex; align-items: center; justify-content: center; color: #5F6E80; font-size: 18px">×</a>
    <div style="flex: 1; height: 12px; border-radius: 6px; background: #E4ECF2; overflow: hidden"><div style="width: 45%; height: 100%; background: #7DBE4B; border-radius: 6px"></div></div>
    <span style="font-size: 13px; font-weight: 700; color: #C2410C; background: #FFEDD5; border-radius: 999px; padding: 4px 10px">3 câu liền</span>
  </div>

  <div style="margin: 0 12px; height: 200px; border-radius: 22px; background: #DDF1C8; position: relative; overflow: hidden; border: 2px solid #CFE8B6">
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 46px; background: #A9D97A; border-radius: 50% 50% 0 0 / 30px 30px 0 0"></div>
    <div style="position: absolute; left: 26px; top: 20px; width: 9px; height: 9px; background: #F2A93B; transform: rotate(20deg)"></div>
    <div style="position: absolute; left: 70px; top: 46px; width: 7px; height: 12px; background: #5AA9E6; transform: rotate(-30deg)"></div>
    <div style="position: absolute; left: 132px; top: 14px; width: 8px; height: 8px; border-radius: 50%; background: #F47C9C"></div>
    <div style="position: absolute; left: 36px; bottom: 18px; width: 140px; height: 150px; display: flex; align-items: flex-end; justify-content: center">
      <svg width="132" height="150" viewBox="0 0 44 50" aria-hidden="true"><path d="M7 16 L1 9 L9 12Z M37 16 L43 9 L35 12Z" fill="#fff" stroke="#3B4A5C" stroke-width="1.2"></path><path d="M11 10 L9 3 L15 8Z M33 10 L35 3 L29 8Z" fill="#E8D9B5" stroke="#3B4A5C" stroke-width="1.2"></path><ellipse cx="22" cy="40" rx="11" ry="9" fill="#fff" stroke="#3B4A5C" stroke-width="1.5"></ellipse><ellipse cx="22" cy="42" rx="5" ry="4" fill="#F7C6D0"></ellipse><path d="M10 38 L3 28" stroke="#3B4A5C" stroke-width="3" stroke-linecap="round"></path><path d="M34 38 L41 28" stroke="#3B4A5C" stroke-width="3" stroke-linecap="round"></path><ellipse cx="22" cy="21" rx="14" ry="13" fill="#fff" stroke="#3B4A5C" stroke-width="1.5"></ellipse><path d="M9 17 Q11 9 19 11 Q20 19 13 25 Q9 23 9 17Z" fill="#5A4236"></path><path d="M13 20 Q15 17 17 20" stroke="#1d1d1d" stroke-width="1.8" fill="none" stroke-linecap="round"></path><path d="M27 20 Q29 17 31 20" stroke="#1d1d1d" stroke-width="1.8" fill="none" stroke-linecap="round"></path><path d="M17 26 Q22 32 27 26Z" fill="#E86A7E"></path><circle cx="11" cy="25" r="1.8" fill="#F9A8B8"></circle><circle cx="33" cy="25" r="1.8" fill="#F9A8B8"></circle></svg>
    </div>
    <div style="position: absolute; right: 14px; top: 26px; width: 168px; background: #fff; border-radius: 16px 16px 16px 4px; padding: 10px 12px; box-shadow: 0 4px 10px rgba(59,74,92,0.12); display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 15px; font-weight: 700; color: #3F6E1F">Yay! Đúng rồi!</div>
      <div style="display: flex; align-items: center; gap: 6px; font-size: 14px">
        <button aria-label="Nghe lại hello" style="width: 30px; height: 30px; border-radius: 50%; border: none; background: #EEF8E4; display: flex; align-items: center; justify-content: center; padding: 0">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5E9A35" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"></path><path d="M16 9a4 4 0 0 1 0 6"></path></svg>
        </button>
        <span><b>hello</b> = xin chào</span>
      </div>
    </div>
  </div>

  <div style="margin: 14px 12px 0; display: flex; flex-direction: column; gap: 10px">
    <div style="font-family: 'Itim', cursive; font-size: 20px">Ghép từ với nghĩa</div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button style="font-family: inherit; font-size: 17px; font-weight: 700; color: #8A99AA; background: #F1F5F8; border: 2px dashed #D3DEE6; border-radius: 14px; padding: 11px">hello</button>
      <button style="font-family: inherit; font-size: 16px; font-weight: 600; color: #8A99AA; background: #F1F5F8; border: 2px dashed #D3DEE6; border-radius: 14px; padding: 11px">xin chào</button>
      <button style="font-family: inherit; font-size: 17px; font-weight: 700; color: #3B4A5C; background: #fff; border: 2px solid #7DBE4B; border-radius: 14px; padding: 11px; box-shadow: 0 0 0 4px #DDF1C8">bye</button>
      <button style="font-family: inherit; font-size: 16px; font-weight: 600; color: #3B4A5C; background: #fff; border: 2px solid #BFDBEF; border-radius: 14px; padding: 11px">cảm ơn</button>
      <button style="font-family: inherit; font-size: 17px; font-weight: 700; color: #3B4A5C; background: #fff; border: 2px solid #BFDBEF; border-radius: 14px; padding: 11px">thanks</button>
      <button style="font-family: inherit; font-size: 16px; font-weight: 600; color: #3B4A5C; background: #fff; border: 2px solid #BFDBEF; border-radius: 14px; padding: 11px">tạm biệt</button>
      <button style="font-family: inherit; font-size: 17px; font-weight: 700; color: #3B4A5C; background: #fff; border: 2px solid #BFDBEF; border-radius: 14px; padding: 11px">please</button>
      <button style="font-family: inherit; font-size: 16px; font-weight: 600; color: #3B4A5C; background: #fff; border: 2px solid #BFDBEF; border-radius: 14px; padding: 11px">làm ơn</button>
    </div>
  </div>

  <div style="margin: 14px 12px 0; background: #fff; border: 2px dashed #BFDBEF; border-radius: 14px; padding: 10px 12px; font-size: 12px; line-height: 1.5; color: #5F6E80">
    Cowdi nhìn theo ngón tay khi bé kéo từ. Chờ quá 8 giây: Cowdi gãi đầu suy nghĩ, chưa nói gì. Sai: Cowdi vỗ tay động viên, chỉ 1 dòng "Gần đúng rồi!".
  </div>

  <div style="margin-top: auto; padding: 12px">
    <button style="width: 100%; font-family: inherit; font-size: 17px; font-weight: 700; color: #fff; background: #7DBE4B; border: none; border-radius: 16px; padding: 15px; box-shadow: 0 4px 0 #5E9A35">Tiếp tục</button>
  </div>
</div>
</body>
</html>
